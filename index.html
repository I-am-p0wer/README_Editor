<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CTF Writeup Editor</title>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --border-color: #333;
            --accent-color: #4caf50;
            --accent-hover: #45a049;
            --primary-color: #2196f3;
            --primary-hover: #1976d2;
            --danger-color: #f44336;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }
        header {
            padding: 15px;
            background-color: #1a1a1a;
            border-bottom: 1px solid var(--border-color);
        }
        h1 {
            margin: 0;
            font-size: 1.2rem;
            color: #fff;
            text-align: center;
        }
        
        /* Tab Navigation */
        .tabs {
            display: flex;
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
        }
        .tab-btn {
            flex: 1;
            padding: 12px 5px;
            background: transparent;
            border: none;
            color: #888;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.2s ease;
        }
        .tab-btn.active {
            color: var(--accent-color);
            border-bottom: 3px solid var(--accent-color);
            background-color: #2a2a2a;
        }

        /* Content Area */
        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            padding: 15px;
            box-sizing: border-box;
        }
        .tab-content {
            display: none;
            flex-direction: column;
            flex: 1;
            height: 100%;
        }
        .tab-content.active {
            display: flex;
        }

        /* Drop Zone */
        .drop-zone {
            border: 2px dashed var(--primary-color);
            border-radius: 8px;
            padding: 25px;
            text-align: center;
            background: #1a1a1a;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 15px;
        }
        .drop-zone:hover, .drop-zone.dragover {
            background: #252525;
            border-color: var(--accent-color);
        }
        .drop-zone p {
            margin: 0;
            color: #aaa;
            font-size: 0.95rem;
            line-height: 1.5;
        }
        .drop-zone span {
            color: var(--primary-color);
            font-weight: bold;
        }

        /* Form & Textarea */
        textarea {
            width: 100%;
            flex: 1;
            background: #121212;
            color: #d4d4d4;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 14px;
            resize: none;
            box-sizing: border-box;
            white-space: pre;
            margin-bottom: 15px;
        }
        .form-container {
            flex: 1;
            overflow-y: auto;
            padding-right: 5px;
            padding-bottom: 20px;
        }
        .form-row {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .form-group {
            margin-bottom: 15px;
            flex: 1;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.85rem;
            color: #bbb;
        }
        input, select {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            background: #1a1a1a;
            color: #fff;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-sizing: border-box;
            appearance: none;
        }
        select {
            background: #1a1a1a url('data:image/svg+xml;utf8,<svg fill="%23ffffff" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/><path d="M0 0h24v24H0z" fill="none"/></svg>') no-repeat right 10px center;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        /* New CTF Badge Settings Card */
        .new-ctf-card {
            background: #232323;
            border: 1px solid var(--primary-color);
            border-radius: 8px;
            padding: 12px;
            margin-top: 10px;
            margin-bottom: 15px;
        }
        .badge-preview {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 8px;
        }

        /* Problem Item Card */
        .problem-item {
            background: #252525;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 15px;
            position: relative;
        }
        .problem-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
        }
        .problem-item-header h3 {
            margin: 0;
            font-size: 0.9rem;
            color: #aaa;
        }
        .btn-remove {
            background: transparent;
            color: var(--danger-color);
            border: none;
            padding: 5px;
            font-size: 0.85rem;
            cursor: pointer;
        }

        /* Buttons */
        .btn-main {
            width: 100%;
            padding: 14px;
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            margin-bottom: 10px;
        }
        .btn-main:active {
            background: var(--accent-hover);
            transform: scale(0.98);
        }
        .btn-primary {
            background: var(--primary-color);
        }
        .btn-primary:active {
            background: var(--primary-hover);
        }
        .btn-outline {
            background: transparent;
            border: 1px dashed var(--border-color);
            color: #aaa;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 15px;
        }
        .btn-outline:active {
            background: #2a2a2a;
        }
        
        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .header-row p {
            margin: 0;
            font-size: 0.9rem;
            color: #aaa;
        }

        /* Toggle Buttons & Preview Box */
        .view-toggle {
            display: flex;
            background: #1a1a1a;
            border-radius: 6px;
            padding: 2px;
            border: 1px solid var(--border-color);
        }
        .view-toggle-btn {
            padding: 4px 10px;
            border: none;
            background: transparent;
            color: #888;
            font-size: 0.8rem;
            cursor: pointer;
            border-radius: 4px;
        }
        .view-toggle-btn.active {
            background: #333;
            color: #fff;
        }
        .preview-box {
            flex: 1;
            background: #121212;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            overflow-y: auto;
            margin-bottom: 15px;
            color: #e0e0e0;
            font-size: 0.95rem;
        }
        .preview-box h3 {
            color: var(--accent-color);
            margin-top: 15px;
            margin-bottom: 8px;
            font-size: 1.1rem;
            border-bottom: 1px solid #2a2a2a;
            padding-bottom: 4px;
        }
        .preview-box h3:first-child {
            margin-top: 0;
        }
        .preview-box ul {
            margin: 5px 0 10px 0;
            padding-left: 20px;
        }
        .preview-box li {
            margin-bottom: 4px;
        }
        .preview-box a {
            color: var(--primary-color);
            text-decoration: none;
        }
        .preview-box code {
            background: #2a2a2a;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.85em;
            color: #ce9178;
        }
        .preview-box img {
            vertical-align: middle;
            height: 20px;
        }
    </style>
</head>
<body>

    <header>
        <h1>CTF Writeup Editor</h1>
    </header>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('tab-input', this)">1. 元データ</button>
        <button class="tab-btn" onclick="switchTab('tab-edit', this)">2. 問題追加</button>
        <button class="tab-btn" onclick="switchTab('tab-output', this)">3. 出力結果</button>
    </div>

    <div class="container">
        <!-- Tab 1: Input -->
        <div id="tab-input" class="tab-content active">
            
            <!-- ドラッグ＆ドロップ / ファイル選択エリア -->
            <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
                <p>📁 <span>ファイルを選択</span> または ここにドロップ<br><small style="color:#666;">(.md / .txt ファイル対応)</small></p>
                <input type="file" id="fileInput" accept=".md,.markdown,.txt" style="display:none;" onchange="handleFileSelect(event)">
            </div>

            <div class="header-row">
                <p>またはテキストを直接ペースト</p>
            </div>
            <textarea id="inputMd" placeholder="ここに既存のMarkdownを貼り付けることもできます..."></textarea>
            <button class="btn-main btn-primary" onclick="parseInput()">解析して次へ進む</button>
        </div>

        <!-- Tab 2: Edit (Form) -->
        <div id="tab-edit" class="tab-content">
            <div class="form-container">
                
                <div class="form-row">
                    <div class="form-group">
                        <label>月 (例: August)</label>
                        <input type="text" id="formMonth">
                    </div>
                    <div class="form-group">
                        <label>日 (例: 27)</label>
                        <input type="number" id="formDay">
                    </div>
                </div>

                <div class="form-group">
                    <label>CTF名 (プラットフォーム)</label>
                    <select id="formCtfSelect" onchange="handleCtfChange()">
                        <option value="NEW">＋ 新規CTFを作成</option>
                    </select>

                    <!-- 新規CTF設定エリア -->
                    <div id="newCtfCard" class="new-ctf-card" style="display:none;">
                        <div class="form-group">
                            <label>新規CTF表示名</label>
                            <input type="text" id="formCtfNew" placeholder="例: MyCustomCTF" oninput="onNewCtfInput()">
                        </div>
                        <div class="form-row" style="margin-bottom:0;">
                            <div class="form-group" style="margin-bottom:0;">
                                <label>参照ID (badge-xxx)</label>
                                <input type="text" id="formBadgeRef" placeholder="badge-myctf">
                            </div>
                            <div class="form-group" style="margin-bottom:0;">
                                <label>バッジカラー (HEX)</label>
                                <input type="color" id="formBadgeColor" value="#1565c0" style="height: 45px; padding: 2px;" onchange="updateBadgePreview()">
                            </div>
                        </div>
                        <div class="badge-preview">
                            <span style="font-size:0.8rem; color:#aaa;">バッジプレビュー:</span>
                            <img id="badgePreviewImg" src="" alt="preview" style="height:20px; display:none;">
                        </div>
                    </div>
                </div>

                <!-- 複数問題の入力コンテナ -->
                <div id="problemsContainer"></div>

                <button class="btn-outline" onclick="addProblemRow()">＋ 別の問題を追加する</button>

            </div>
            <button class="btn-main" onclick="addWriteup()">追記して生成</button>
        </div>

        <!-- Tab 3: Output -->
        <div id="tab-output" class="tab-content">
            <div class="header-row">
                <p>更新後のMarkdown</p>
                <div class="view-toggle">
                    <button class="view-toggle-btn active" id="btnModeText" onclick="setOutputMode('text')">テキスト</button>
                    <button class="view-toggle-btn" id="btnModePreview" onclick="setOutputMode('preview')">プレビュー</button>
                </div>
            </div>
            
            <textarea id="outputMd" readonly placeholder="更新結果がここに表示されます..."></textarea>
            <div id="previewArea" class="preview-box" style="display:none;"></div>

            <button class="btn-main btn-primary" onclick="copyOutput()">クリップボードにコピー</button>
        </div>
    </div>

    <script>
        let parsedData = {};
        let badges = {};
        let ctfToBadgeMap = {};
        let existingCtfs = new Set();
        let categoriesSet = new Set(["Web", "Pwn", "Rev", "Crypto", "Forensics", "Misc", "Hardware", "OSINT", "Mobile", "Blockchain"]);
        let problemCount = 0;
        const MONTHS = ["December", "November", "October", "September", "August", "July", "June", "May", "April", "March", "February", "January"];

        // 初期設定
        const now = new Date();
        document.getElementById('formMonth').value = now.toLocaleString('en-US', { month: 'long' });
        document.getElementById('formDay').value = now.getDate();
        
        // 初期の1問目を追加
        addProblemRow();

        // ドラッグ＆ドロップ機能の実装
        const dropZone = document.getElementById('dropZone');

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
            document.body.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.add('dragover'), false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.remove('dragover'), false);
        });

        dropZone.addEventListener('drop', handleDrop, false);

        function handleDrop(e) {
            const dt = e.dataTransfer;
            const files = dt.files;
            if (files.length > 0) {
                readFile(files[0]);
            }
        }

        function handleFileSelect(e) {
            const files = e.target.files;
            if (files.length > 0) {
                readFile(files[0]);
            }
        }

        function readFile(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('inputMd').value = e.target.result;
                parseInput(); // ファイル読み込み後、自動で解析して「問題追加」タブへ進む
            };
            reader.readAsText(file);
        }

        // タブ切り替え処理
        function switchTab(tabId, btnElement) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');

            if (btnElement) {
                document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
                btnElement.classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
                const buttons = document.querySelectorAll('.tab-btn');
                if (tabId === 'tab-input') buttons[0].classList.add('active');
                if (tabId === 'tab-edit') buttons[1].classList.add('active');
                if (tabId === 'tab-output') buttons[2].classList.add('active');
            }
        }

        // 表示モード切り替え（テキスト / プレビュー）
        function setOutputMode(mode) {
            const txt = document.getElementById('outputMd');
            const prev = document.getElementById('previewArea');
            const btnText = document.getElementById('btnModeText');
            const btnPrev = document.getElementById('btnModePreview');

            if (mode === 'preview') {
                txt.style.display = 'none';
                prev.style.display = 'block';
                btnText.classList.remove('active');
                btnPrev.classList.add('active');
            } else {
                txt.style.display = 'block';
                prev.style.display = 'none';
                btnText.classList.add('active');
                btnPrev.classList.remove('active');
            }
        }

        // 現在選択中のCTF名を取得
        function getSelectedCtfName() {
            const selectVal = document.getElementById('formCtfSelect').value;
            if (selectVal === 'NEW') {
                return document.getElementById('formCtfNew').value.trim();
            }
            return selectVal;
        }

        // CTFプルダウン切り替え時の処理
        function handleCtfChange() {
            const selectVal = document.getElementById('formCtfSelect').value;
            const newCard = document.getElementById('newCtfCard');
            
            if (selectVal === 'NEW') {
                newCard.style.display = 'block';
                onNewCtfInput();
            } else {
                newCard.style.display = 'none';
            }
            updateAllPaths();
        }

        function onNewCtfInput() {
            const ctfName = document.getElementById('formCtfNew').value.trim();
            if (ctfName) {
                const slug = ctfName.toLowerCase().replace(/[^a-z0-9_]/g, '');
                document.getElementById('formBadgeRef').value = `badge-${slug}`;
            }
            updateBadgePreview();
            updateAllPaths();
        }

        function updateBadgePreview() {
            const ctfName = document.getElementById('formCtfNew').value.trim() || 'Badge';
            const color = document.getElementById('formBadgeColor').value.replace('#', '');
            const img = document.getElementById('badgePreviewImg');
            img.src = `https://img.shields.io/badge/${encodeURIComponent(ctfName)}-${color}?style=flat-square`;
            img.style.display = 'inline';
        }

        // カテゴリのドロップダウンHTML生成（アルファベット順ソート）
        function buildCategorySelectOptions() {
            let options = '';
            const sortedCategories = Array.from(categoriesSet).sort((a, b) => a.localeCompare(b, 'en', { sensitivity: 'base' }));
            sortedCategories.forEach(cat => {
                options += `<option value="${cat}">${cat}</option>`;
            });
            options += `<option value="NEW">＋ 新規カテゴリ</option>`;
            return options;
        }

        // カテゴリ選択変更処理
        function handleCategoryChange(selectEl) {
            const customInput = selectEl.nextElementSibling;
            if (selectEl.value === 'NEW') {
                customInput.style.display = 'block';
                customInput.focus();
            } else {
                customInput.style.display = 'none';
            }
        }

        // 入力欄の追加
        function addProblemRow() {
            problemCount++;
            const container = document.getElementById('problemsContainer');
            
            const itemHTML = `
                <div class="problem-item" id="problem-${problemCount}">
                    <div class="problem-item-header">
                        <h3>問題 ${problemCount}</h3>
                        ${problemCount > 1 ? `<button class="btn-remove" onclick="removeProblemRow(${problemCount})">✕ 削除</button>` : ''}
                    </div>
                    <div class="form-row" style="margin-bottom: 10px;">
                        <div class="form-group" style="margin-bottom: 0;">
                            <input type="text" class="input-subfolder" placeholder="サブフォルダ (任意: 例: web)" oninput="updatePath(this)">
                        </div>
                        <div class="form-group" style="margin-bottom: 0;">
                            <input type="text" class="input-chal" placeholder="問題名 (例: Meow)" oninput="updatePath(this)">
                        </div>
                    </div>
                    <div class="form-group" style="margin-bottom: 10px;">
                        <input type="text" class="input-path" placeholder="ファイルパス (自動生成)">
                    </div>
                    <div class="form-group" style="margin-bottom: 0;">
                        <label style="font-size: 0.75rem;">カテゴリ</label>
                        <select class="input-cat-select" onchange="handleCategoryChange(this)">
                            ${buildCategorySelectOptions()}
                        </select>
                        <input type="text" class="input-cat-custom" placeholder="新規カテゴリ名を入力" style="display:none; margin-top:5px;">
                    </div>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', itemHTML);
        }

        function removeProblemRow(id) {
            const item = document.getElementById(`problem-${id}`);
            if (item) item.remove();
        }

        // 全問題カードのカテゴリ選択肢を一括更新
        function refreshAllCategorySelects() {
            document.querySelectorAll('.input-cat-select').forEach(selectEl => {
                const currentVal = selectEl.value;
                selectEl.innerHTML = buildCategorySelectOptions();
                if (Array.from(selectEl.options).some(opt => opt.value === currentVal)) {
                    selectEl.value = currentVal;
                }
            });
        }

        // パスの自動生成（単一）
        function updatePath(inputElement) {
            const item = inputElement.closest('.problem-item');
            const ctf = getSelectedCtfName().replace(/\s+/g, '_');
            const subfolder = item.querySelector('.input-subfolder').value.trim().replace(/^\/+|\/+$/g, '').replace(/\s+/g, '_');
            const chal = item.querySelector('.input-chal').value.trim().replace(/\s+/g, '_');
            
            if (ctf && chal) {
                if (subfolder) {
                    item.querySelector('.input-path').value = `${ctf}/${subfolder}/${chal}/README.md`;
                } else {
                    item.querySelector('.input-path').value = `${ctf}/${chal}/README.md`;
                }
            } else {
                item.querySelector('.input-path').value = '';
            }
        }

        // パスの自動生成（全体再計算）
        function updateAllPaths() {
            document.querySelectorAll('.input-chal').forEach(input => {
                updatePath(input);
            });
        }

        // Markdownのパース
        function parseInput() {
            const text = document.getElementById('inputMd').value;
            const lines = text.split('\n');
            
            parsedData = {};
            badges = {};
            ctfToBadgeMap = {};
            existingCtfs.clear();
            let currentMonth = null, currentDay = null, currentCtf = null, currentBadgeRef = null;

            lines.forEach(line => {
                const s = line.trim();
                if (!s) return;

                // Month
                let m = s.match(/^###\s+(.+)/);
                if (m) {
                    currentMonth = m[1];
                    if (!parsedData[currentMonth]) parsedData[currentMonth] = {};
                    return;
                }

                // Day
                m = s.match(/^\*\s+\*\*(\d+)\*\*/);
                if (m) {
                    currentDay = parseInt(m[1], 10);
                    if (currentMonth && !parsedData[currentMonth][currentDay]) {
                        parsedData[currentMonth][currentDay] = {};
                    }
                    return;
                }

                // CTF Name & Badge
                m = s.match(/^\*\s+!\[(.*?)\]\[(.*?)\]/);
                if (m) {
                    currentCtf = m[1];
                    currentBadgeRef = m[2];
                    existingCtfs.add(currentCtf);
                    ctfToBadgeMap[currentCtf] = currentBadgeRef;

                    if (currentMonth && currentDay && !parsedData[currentMonth][currentDay][currentCtf]) {
                        parsedData[currentMonth][currentDay][currentCtf] = {
                            badgeRef: currentBadgeRef,
                            chals: []
                        };
                    }
                    return;
                }

                // Challenge
                m = s.match(/^\*\s+\[(.*?)\]\((.*?)\)\s+—\s+`(.*?)`/);
                if (m) {
                    if (currentMonth && currentDay && currentCtf) {
                        const catName = m[3];
                        categoriesSet.add(catName);
                        parsedData[currentMonth][currentDay][currentCtf].chals.push({
                            name: m[1], path: m[2], cat: catName
                        });
                    }
                    return;
                }

                // Footnote Badges
                m = line.match(/^\[(.*?)\]:\s+(.+)/);
                if (m) {
                    badges[m[1]] = m[2];
                }
            });

            // セレクトボックスの更新（アルファベット順）
            const ctfSelect = document.getElementById('formCtfSelect');
            ctfSelect.innerHTML = '';
            
            if (existingCtfs.size > 0) {
                const sortedCtfs = Array.from(existingCtfs).sort((a, b) => a.localeCompare(b, 'en', { sensitivity: 'base' }));
                sortedCtfs.forEach(ctf => {
                    const opt = document.createElement('option');
                    opt.value = ctf;
                    opt.textContent = ctf;
                    ctfSelect.appendChild(opt);
                });
            }
            
            const newOpt = document.createElement('option');
            newOpt.value = "NEW";
            newOpt.textContent = "＋ 新規CTFを作成";
            ctfSelect.appendChild(newOpt);

            if (existingCtfs.size > 0) {
                ctfSelect.selectedIndex = 0;
            } else {
                ctfSelect.value = "NEW";
            }
            handleCtfChange();
            refreshAllCategorySelects();

            switchTab('tab-edit');
        }

        // Markdown生成
        function addWriteup() {
            if (Object.keys(parsedData).length === 0 && document.getElementById('inputMd').value.trim() !== "") {
                parseInput();
            }

            const month = document.getElementById('formMonth').value.trim();
            const day = parseInt(document.getElementById('formDay').value.trim(), 10);
            const selectVal = document.getElementById('formCtfSelect').value;
            const ctf = getSelectedCtfName();

            if (!month || !day || !ctf) {
                alert("月、日、CTF名は必須です。");
                return;
            }

            // バッジ参照IDの特定・作成
            let badgeRef = '';
            if (selectVal === 'NEW') {
                badgeRef = document.getElementById('formBadgeRef').value.trim() || `badge-${ctf.toLowerCase().replace(/\s+/g, '')}`;
                const color = document.getElementById('formBadgeColor').value.replace('#', '');
                badges[badgeRef] = `https://img.shields.io/badge/${encodeURIComponent(ctf.replace(/\s+/g, '_'))}-${color}?style=flat-square`;
                ctfToBadgeMap[ctf] = badgeRef;
            } else {
                badgeRef = ctfToBadgeMap[ctf] || `badge-${ctf.toLowerCase().replace(/\s+/g, '')}`;
            }

            // データのベース準備
            if (!parsedData[month]) parsedData[month] = {};
            if (!parsedData[month][day]) parsedData[month][day] = {};
            if (!parsedData[month][day][ctf]) {
                parsedData[month][day][ctf] = { badgeRef: badgeRef, chals: [] };
            }

            // 問題要素の収集
            const problemItems = document.querySelectorAll('.problem-item');
            let hasValidProblem = false;

            problemItems.forEach(item => {
                const chalName = item.querySelector('.input-chal').value.trim();
                const path = item.querySelector('.input-path').value.trim();
                
                const selectCat = item.querySelector('.input-cat-select').value;
                let cat = selectCat;
                if (selectCat === 'NEW') {
                    cat = item.querySelector('.input-cat-custom').value.trim() || 'Misc';
                    categoriesSet.add(cat);
                }

                if (chalName) {
                    parsedData[month][day][ctf].chals.push({ name: chalName, path: path, cat: cat });
                    hasValidProblem = true;
                }
            });

            if (!hasValidProblem) {
                alert("最低1つの問題名を入力してください。");
                return;
            }

            refreshAllCategorySelects();
            renderOutput();
            switchTab('tab-output');
        }

        function renderOutput() {
            let out = [];
            let previewHtml = [];

            const sortedMonths = Object.keys(parsedData).sort((a, b) => {
                let idxA = MONTHS.indexOf(a);
                let idxB = MONTHS.indexOf(b);
                if (idxA === -1) idxA = 99;
                if (idxB === -1) idxB = 99;
                return idxA - idxB;
            });

            sortedMonths.forEach(month => {
                out.push(`### ${month}`);
                previewHtml.push(`<h3>${month}</h3>`);
                
                const sortedDays = Object.keys(parsedData[month]).sort((a, b) => b - a);
                
                previewHtml.push(`<ul>`);
                sortedDays.forEach(day => {
                    out.push(`* **${day}**`);
                    previewHtml.push(`<li><strong>${day}</strong><ul>`);
                    
                    const ctfs = parsedData[month][day];
                    // 1. CTF名をアルファベット昇順でソート
                    const sortedCtfNames = Object.keys(ctfs).sort((a, b) => a.localeCompare(b, 'en', { sensitivity: 'base' }));

                    sortedCtfNames.forEach(ctfName => {
                        const ctfData = ctfs[ctfName];
                        out.push(`  * ![${ctfName}][${ctfData.badgeRef}]`);
                        const badgeUrl = badges[ctfData.badgeRef] || '';
                        previewHtml.push(`<li><img src="${badgeUrl}" alt="${ctfName}"><ul>`);

                        // 2. 問題名（Challenge）をアルファベット昇順でソート
                        const sortedChals = [...ctfData.chals].sort((a, b) => a.name.localeCompare(b.name, 'en', { sensitivity: 'base' }));

                        sortedChals.forEach(chal => {
                            out.push(`    * [${chal.name}](${chal.path}) — \`${chal.cat}\``);
                            previewHtml.push(`<li><a href="${chal.path}">${chal.name}</a> — <code>${chal.cat}</code></li>`);
                        });
                        previewHtml.push(`</ul></li>`);
                    });
                    previewHtml.push(`</ul></li>`);
                });
                previewHtml.push(`</ul>`);
            });

            out.push("\n\n");
            
            // 3. フッターのバッジ参照URLをアルファベット昇順で一覧生成
            const sortedBadgeRefs = Object.keys(badges).sort((a, b) => a.localeCompare(b, 'en', { sensitivity: 'base' }));
            sortedBadgeRefs.forEach(ref => {
                out.push(`[${ref}]: ${badges[ref]}`);
            });

            document.getElementById('outputMd').value = out.join('\n') + '\n';
            document.getElementById('previewArea').innerHTML = previewHtml.join('');
        }

        async function copyOutput() {
            const outText = document.getElementById('outputMd').value;
            try {
                await navigator.clipboard.writeText(outText);
                
                const btn = document.querySelector('#tab-output .btn-primary');
                const originalText = btn.innerText;
                btn.innerText = 'コピー完了！';
                btn.style.background = '#4caf50';
                
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.style.background = 'var(--primary-color)';
                }, 2000);
            } catch (err) {
                const outArea = document.getElementById('outputMd');
                outArea.select();
                document.execCommand('copy');
                alert('コピーしました！');
            }
        }
    </script>
</body>
