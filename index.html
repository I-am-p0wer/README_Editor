<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Icon Settings -->
    <link rel="icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="icon.png">
    <title>CTF Writeup Editor</title>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --border-color: #333;
            --accent-color: #4caf50;
            --accent-hover: #45a049;
            --primary-color: #2196f3;
            --primary-hover: #1976d2;
            --danger-color: #f44336;
            --x-color: #1d9bf0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }
        header {
            padding: 15px;
            background-color: #1a1a1a;
            border-bottom: 1px solid var(--border-color);
        }
        h1 {
            margin: 0;
            font-size: 1.2rem;
            color: #fff;
            text-align: center;
        }
        
        /* Tab Navigation */
        .tabs {
            display: flex;
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
        }
        .tab-btn {
            flex: 1;
            padding: 12px 5px;
            background: transparent;
            border: none;
            color: #888;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.2s ease;
        }
        .tab-btn.active {
            color: var(--accent-color);
            border-bottom: 3px solid var(--accent-color);
            background-color: #2a2a2a;
        }

        /* Content Area */
        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            padding: 15px;
            box-sizing: border-box;
            overflow-y: auto;
        }
        .tab-content {
            display: none;
            flex-direction: column;
            flex: 1;
            height: 100%;
        }
        .tab-content.active {
            display: flex;
        }

        /* File Upload Box */
        .file-upload-box {
            border: 2px dashed var(--border-color);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            background: #181818;
            margin-bottom: 15px;
            cursor: pointer;
            transition: border-color 0.2s, background-color 0.2s;
        }
        .file-upload-box:hover, .file-upload-box.dragover {
            border-color: var(--primary-color);
            background: #222;
        }
        .file-upload-box p {
            margin: 0 0 10px 0;
            color: #aaa;
            font-size: 0.9rem;
        }
        .file-upload-box input[type="file"] {
            display: none;
        }

        /* Form & Textarea */
        textarea {
            width: 100%;
            flex: 1;
            background: #121212;
            color: #d4d4d4;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 14px;
            resize: none;
            box-sizing: border-box;
            white-space: pre;
            margin-bottom: 15px;
            min-height: 120px;
        }
        .form-container {
            flex: 1;
            overflow-y: auto;
            padding-right: 5px;
            padding-bottom: 20px;
        }
        .form-row {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .form-group {
            margin-bottom: 15px;
            flex: 1;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.85rem;
            color: #bbb;
        }
        input, select {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            background: #1a1a1a;
            color: #fff;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-sizing: border-box;
            appearance: none;
        }
        select {
            background: #1a1a1a url('data:image/svg+xml;utf8,<svg fill="%23ffffff" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/><path d="M0 0h24v24H0z" fill="none"/></svg>') no-repeat right 10px center;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        /* New CTF Badge Settings Card */
        .new-ctf-card {
            background: #232323;
            border: 1px solid var(--primary-color);
            border-radius: 8px;
            padding: 12px;
            margin-top: 10px;
            margin-bottom: 15px;
        }
        .badge-preview {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 8px;
        }

        /* Problem Item Card */
        .problem-item {
            background: #252525;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 15px;
            position: relative;
        }
        .problem-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
        }
        .problem-item-header h3 {
            margin: 0;
            font-size: 0.9rem;
            color: #aaa;
        }
        .btn-remove {
            background: transparent;
            color: var(--danger-color);
            border: none;
            padding: 5px;
            font-size: 0.85rem;
            cursor: pointer;
        }

        /* Buttons */
        .btn-main {
            width: 100%;
            padding: 14px;
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            margin-bottom: 10px;
        }
        .btn-main:active {
            background: var(--accent-hover);
            transform: scale(0.98);
        }
        .btn-primary {
            background: var(--primary-color);
        }
        .btn-primary:active {
            background: var(--primary-hover);
        }
        .btn-x {
            background: var(--x-color);
        }
        .btn-x:active {
            background: #1a8cd8;
        }
        .btn-outline {
            background: transparent;
            border: 1px dashed var(--border-color);
            color: #aaa;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 15px;
        }
        .btn-outline:active {
            background: #2a2a2a;
        }
        
        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .header-row p {
            margin: 0;
            font-size: 0.9rem;
            color: #aaa;
        }

        /* Toggle Buttons & Preview Box */
        .view-toggle {
            display: flex;
            background: #1a1a1a;
            border-radius: 6px;
            padding: 2px;
            border: 1px solid var(--border-color);
        }
        .view-toggle-btn {
            padding: 4px 10px;
            border: none;
            background: transparent;
            color: #888;
            font-size: 0.8rem;
            cursor: pointer;
            border-radius: 4px;
        }
        .view-toggle-btn.active {
            background: #333;
            color: #fff;
        }
        .preview-box {
            flex: 1;
            background: #121212;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            overflow-y: auto;
            margin-bottom: 15px;
            color: #e0e0e0;
            font-size: 0.95rem;
            min-height: 120px;
        }
        .preview-box h3 {
            color: var(--accent-color);
            margin-top: 15px;
            margin-bottom: 8px;
            font-size: 1.1rem;
            border-bottom: 1px solid #2a2a2a;
            padding-bottom: 4px;
        }
        .preview-box h3:first-child {
            margin-top: 0;
        }
        .preview-box ul {
            margin: 5px 0 10px 0;
            padding-left: 20px;
            list-style: none;
        }
        .preview-box li {
            margin-bottom: 6px;
            position: relative;
        }
        .preview-box a {
            color: var(--primary-color);
            text-decoration: none;
        }
        .preview-box code {
            background: #2a2a2a;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.85em;
            color: #ce9178;
        }
        .preview-box img {
            vertical-align: middle;
            height: 20px;
        }

        /* Interactive Preview Actions */
        .preview-item-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 2px 0;
        }
        .preview-item-content {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .preview-actions {
            display: inline-flex;
            gap: 4px;
            opacity: 0.7;
            transition: opacity 0.2s;
        }
        .preview-item-row:hover .preview-actions {
            opacity: 1;
        }
        .btn-action-sm {
            background: #2a2a2a;
            border: 1px solid #444;
            color: #ccc;
            border-radius: 4px;
            padding: 2px 6px;
            font-size: 0.75rem;
            cursor: pointer;
        }
        .btn-action-sm:hover {
            background: #3a3a3a;
            color: #fff;
        }
        .btn-action-del {
            color: var(--danger-color);
            border-color: #522;
        }
        .btn-action-del:hover {
            background: #411;
            color: #ff6b6b;
        }

        .x-section {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid var(--border-color);
        }

        /* Multi X Post Card */
        .x-post-card {
            background: #1a1a1a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 15px;
        }
        .x-post-card-header {
            font-size: 0.85rem;
            color: var(--x-color);
            font-weight: bold;
            margin-bottom: 8px;
        }
        .btn-row {
            display: flex;
            gap: 10px;
        }
        .btn-row .btn-main {
            margin-bottom: 0;
        }
    </style>
</head>
<body>

    <header>
        <h1>CTF Writeup Editor</h1>
    </header>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('tab-input', this)">1. Raw Data</button>
        <button class="tab-btn" onclick="switchTab('tab-edit', this)">2. Manage / Add</button>
        <button class="tab-btn" onclick="switchTab('tab-output', this)">3. Output</button>
    </div>

    <div class="container">
        <div id="tab-input" class="tab-content active">
            
            <div class="file-upload-box" id="dropArea" onclick="document.getElementById('fileInput').click()">
                <p id="fileLabel">📁 Drop or select a Markdown file (.md)</p>
                <input type="file" id="fileInput" accept=".md,.txt" onchange="handleFileSelect(event)">
            </div>

            <div class="header-row">
                <p>Or paste text directly</p>
            </div>
            <textarea id="inputMd" placeholder="Paste existing list here..."></textarea>
            <button class="btn-main btn-primary" onclick="parseInput()">Parse & Continue</button>
        </div>

        <div id="tab-edit" class="tab-content">
            <div class="form-container">
                
                <div class="form-row">
                    <div class="form-group">
                        <label>Month (e.g., August)</label>
                        <input type="text" id="formMonth">
                    </div>
                    <div class="form-group">
                        <label>Day (e.g., 27)</label>
                        <input type="number" id="formDay">
                    </div>
                </div>

                <div class="form-group">
                    <label>CTF Name (Platform)</label>
                    <select id="formCtfSelect" onchange="handleCtfChange()">
                        <option value="NEW">＋ Create New CTF</option>
                    </select>

                    <div id="newCtfCard" class="new-ctf-card" style="display:none;">
                        <div class="form-group">
                            <label>New CTF Display Name</label>
                            <input type="text" id="formCtfNew" placeholder="e.g., MyCustomCTF" oninput="onNewCtfInput()">
                        </div>
                        <div class="form-row" style="margin-bottom:0;">
                            <div class="form-group" style="margin-bottom:0;">
                                <label>Reference ID (badge-xxx)</label>
                                <input type="text" id="formBadgeRef" placeholder="badge-myctf">
                            </div>
                            <div class="form-group" style="margin-bottom:0;">
                                <label>Badge Color (HEX)</label>
                                <input type="color" id="formBadgeColor" value="#1565c0" style="height: 45px; padding: 2px;" onchange="updateBadgePreview()">
                            </div>
                        </div>
                        <div class="badge-preview">
                            <span style="font-size:0.8rem; color:#aaa;">Badge Preview:</span>
                            <img id="badgePreviewImg" src="" alt="preview" style="display:none;">
                        </div>
                    </div>
                </div>

                <div id="problemsContainer"></div>

                <button class="btn-outline" onclick="addProblemRow()">＋ Add Another Challenge</button>

            </div>
            <button class="btn-main" onclick="addWriteup()">Generate Updated Markdown</button>
        </div>

        <div id="tab-output" class="tab-content">
            <div class="header-row">
                <p>Updated Markdown</p>
                <div class="view-toggle">
                    <button class="view-toggle-btn active" id="btnModeText" onclick="setOutputMode('text')">Text</button>
                    <button class="view-toggle-btn" id="btnModePreview" onclick="setOutputMode('preview')">Preview</button>
                </div>
            </div>
            
            <textarea id="outputMd" readonly placeholder="Updated result will appear here..."></textarea>
            <div id="previewArea" class="preview-box" style="display:none;"></div>

            <button class="btn-main btn-primary" id="btnCopyMd" onclick="copyOutput('outputMd', this, 'Markdown copied!')">Copy Markdown</button>

            <div class="x-section">
                <div class="header-row">
                    <p>X (Twitter) Post Texts (Separated per problem)</p>
                    <select id="xHeaderSelect" onchange="renderXPost()" style="width: auto; padding: 4px 8px; font-size: 0.8rem;">
                        <option value="New Writeup!" selected>New Writeup!</option>
                        <option value="CTF Writeup!">CTF Writeup!</option>
                    </select>
                </div>
                <div id="xPostsContainer"></div>
            </div>
        </div>
    </div>

    <script>
        let parsedData = {};
        let badges = {};
        let ctfToBadgeMap = {};
        let existingCtfs = new Set();
        let categoriesSet = new Set(["Web", "Pwn", "Rev", "Crypto", "Forensics", "Misc", "Hardware", "OSINT", "Mobile", "Blockchain"]);
        let problemCount = 0;
        let lastAddedItems = [];
        let lastAddedCtf = "";
        const MONTHS = ["December", "November", "October", "September", "August", "July", "June", "May", "April", "March", "February", "January"];
        const GITHUB_BASE_URL = "https://github.com/I-am-p0wer/CTF-Writeups/blob/main";

        // Initial Setup
        const now = new Date();
        document.getElementById('formMonth').value = now.toLocaleString('en-US', { month: 'long' });
        document.getElementById('formDay').value = now.getDate();

        // Drag & Drop handlers
        const dropArea = document.getElementById('dropArea');
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropArea.addEventListener(eventName, e => {
                e.preventDefault();
                e.stopPropagation();
            }, false);
        });
        ['dragenter', 'dragover'].forEach(eventName => {
            dropArea.addEventListener(eventName, () => dropArea.classList.add('dragover'), false);
        });
        ['dragleave', 'drop'].forEach(eventName => {
            dropArea.addEventListener(eventName, () => dropArea.classList.remove('dragover'), false);
        });
        dropArea.addEventListener('drop', e => {
            const dt = e.dataTransfer;
            const files = dt.files;
            if (files.length > 0) {
                readFile(files[0]);
            }
        });

        function handleFileSelect(e) {
            const files = e.target.files;
            if (files.length > 0) {
                readFile(files[0]);
            }
        }

        function readFile(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('inputMd').value = e.target.result;
                document.getElementById('fileLabel').textContent = `📄 Loaded: ${file.name}`;
                parseInput();
            };
            reader.readAsText(file);
        }

        // Tab switching
        function switchTab(tabId, btnElement) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');

            if (btnElement) {
                document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
                btnElement.classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
                const buttons = document.querySelectorAll('.tab-btn');
                if (tabId === 'tab-input') buttons[0].classList.add('active');
                if (tabId === 'tab-edit') buttons[1].classList.add('active');
                if (tabId === 'tab-output') buttons[2].classList.add('active');
            }
        }

        // Output mode toggle (Text / Preview)
        function setOutputMode(mode) {
            const txt = document.getElementById('outputMd');
            const prev = document.getElementById('previewArea');
            const btnText = document.getElementById('btnModeText');
            const btnPrev = document.getElementById('btnModePreview');

            if (mode === 'preview') {
                txt.style.display = 'none';
                prev.style.display = 'block';
                btnText.classList.remove('active');
                btnPrev.classList.add('active');
            } else {
                txt.style.display = 'block';
                prev.style.display = 'none';
                btnText.classList.add('active');
                btnPrev.classList.remove('active');
            }
        }

        // Get currently selected CTF name
        function getSelectedCtfName() {
            const selectVal = document.getElementById('formCtfSelect').value;
            if (selectVal === 'NEW') {
                return document.getElementById('formCtfNew').value.trim();
            }
            return selectVal;
        }

        // Handle CTF select change
        function handleCtfChange() {
            const selectVal = document.getElementById('formCtfSelect').value;
            const newCard = document.getElementById('newCtfCard');
            
            if (selectVal === 'NEW') {
                newCard.style.display = 'block';
                onNewCtfInput();
            } else {
                newCard.style.display = 'none';
            }
            loadExistingChallengesForSelectedCtf();
        }

        function onNewCtfInput() {
            const ctfName = document.getElementById('formCtfNew').value.trim();
            if (ctfName) {
                const slug = ctfName.toLowerCase().replace(/[^a-z0-9_]/g, '');
                document.getElementById('formBadgeRef').value = `badge-${slug}`;
            }
            updateBadgePreview();
            updateAllPaths();
        }

        function updateBadgePreview() {
            const ctfName = document.getElementById('formCtfNew').value.trim() || 'Badge';
            const color = document.getElementById('formBadgeColor').value.replace('#', '');
            const img = document.getElementById('badgePreviewImg');
            img.src = `https://img.shields.io/badge/${encodeURIComponent(ctfName)}-${color}?style=flat-square`;
            img.style.display = 'inline';
        }

        // Build category options (Alphabetical)
        function buildCategorySelectOptions() {
            let options = '';
            const sortedCategories = Array.from(categoriesSet).sort((a, b) => a.localeCompare(b, 'en', { sensitivity: 'base' }));
            sortedCategories.forEach(cat => {
                options += `<option value="${cat}">${cat}</option>`;
            });
            options += `<option value="NEW">＋ New Category</option>`;
            return options;
        }

        // Handle category selection change
        function handleCategoryChange(selectEl) {
            const customInput = selectEl.nextElementSibling;
            if (selectEl.value === 'NEW') {
                customInput.style.display = 'block';
                customInput.focus();
            } else {
                customInput.style.display = 'none';
            }
        }

        // Add problem row
        function addProblemRow(initialData = null) {
            problemCount++;
            const container = document.getElementById('problemsContainer');
            
            const chalName = initialData ? initialData.name : '';
            const fullPath = initialData ? initialData.path : '';
            const cat = initialData ? initialData.cat : '';
            const comment = initialData ? (initialData.comment || '') : '';

            // Extract subfolder if match format: CTF/subfolder/chal/README.md
            let subfolder = '';
            if (fullPath) {
                const parts = fullPath.split('/');
                if (parts.length === 4) {
                    subfolder = parts[1];
                }
            }

            const itemHTML = `
                <div class="problem-item" id="problem-${problemCount}">
                    <div class="problem-item-header">
                        <h3>Challenge</h3>
                        <button class="btn-remove" onclick="removeProblemRow(${problemCount})">✕ Remove</button>
                    </div>
                    <div class="form-row" style="margin-bottom: 10px;">
                        <div class="form-group" style="margin-bottom: 0;">
                            <input type="text" class="input-subfolder" value="${subfolder}" placeholder="Subfolder (Optional: e.g., web)" oninput="updatePath(this)">
                        </div>
                        <div class="form-group" style="margin-bottom: 0;">
                            <input type="text" class="input-chal" value="${chalName}" placeholder="Challenge Name (e.g., Meow)" oninput="updatePath(this)">
                        </div>
                    </div>
                    <div class="form-group" style="margin-bottom: 10px;">
                        <input type="text" class="input-path" value="${fullPath}" placeholder="File Path (Auto-generated)">
                    </div>
                    <div class="form-row" style="margin-bottom: 0;">
                        <div class="form-group" style="margin-bottom: 0;">
                            <label style="font-size: 0.75rem;">Category</label>
                            <select class="input-cat-select" onchange="handleCategoryChange(this)">
                                ${buildCategorySelectOptions()}
                            </select>
                            <input type="text" class="input-cat-custom" placeholder="Enter new category name" style="display:none; margin-top:5px;">
                        </div>
                        <div class="form-group" style="margin-bottom: 0;">
                            <label style="font-size: 0.75rem;">Comment for X (Optional)</label>
                            <input type="text" class="input-comment" value="${comment}" placeholder="Brief comment for post">
                        </div>
                    </div>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', itemHTML);

            const row = document.getElementById(`problem-${problemCount}`);
            if (cat) {
                const selectEl = row.querySelector('.input-cat-select');
                if (Array.from(selectEl.options).some(o => o.value === cat)) {
                    selectEl.value = cat;
                } else {
                    selectEl.value = 'NEW';
                    handleCategoryChange(selectEl);
                    row.querySelector('.input-cat-custom').value = cat;
                }
            }
            if (!fullPath) {
                updatePath(row.querySelector('.input-chal'));
            }
        }

        function removeProblemRow(id) {
            const item = document.getElementById(`problem-${id}`);
            if (item) item.remove();
        }

        // Refresh all category select options
        function refreshAllCategorySelects() {
            document.querySelectorAll('.input-cat-select').forEach(selectEl => {
                const currentVal = selectEl.value;
                selectEl.innerHTML = buildCategorySelectOptions();
                if (Array.from(selectEl.options).some(opt => opt.value === currentVal)) {
                    selectEl.value = currentVal;
                }
            });
        }

        // Single path update
        function updatePath(inputElement) {
            const item = inputElement.closest('.problem-item');
            const ctf = getSelectedCtfName().replace(/\s+/g, '_');
            const subfolder = item.querySelector('.input-subfolder').value.trim().replace(/^\/+|\/+$/g, '').replace(/\s+/g, '_');
            const chal = item.querySelector('.input-chal').value.trim().replace(/\s+/g, '_');
            
            if (ctf && chal) {
                if (subfolder) {
                    item.querySelector('.input-path').value = `${ctf}/${subfolder}/${chal}/README.md`;
                } else {
                    item.querySelector('.input-path').value = `${ctf}/${chal}/README.md`;
                }
            } else {
                item.querySelector('.input-path').value = '';
            }
        }

        // Recalculate all paths
        function updateAllPaths() {
            document.querySelectorAll('.input-chal').forEach(input => {
                updatePath(input);
            });
        }

        // Load existing challenges for selected CTF/Date
        function loadExistingChallengesForSelectedCtf() {
            const container = document.getElementById('problemsContainer');
            container.innerHTML = '';
            
            const month = document.getElementById('formMonth').value.trim();
            const day = parseInt(document.getElementById('formDay').value.trim(), 10);
            const ctf = getSelectedCtfName();

            if (parsedData[month] && parsedData[month][day] && parsedData[month][day][ctf]) {
                const chals = parsedData[month][day][ctf].chals;
                chals.forEach(chal => addProblemRow(chal));
            } else {
                addProblemRow();
            }
        }

        // Parse Markdown input
        function parseInput() {
            const text = document.getElementById('inputMd').value;
            const lines = text.split('\n');
            
            parsedData = {};
            badges = {};
            ctfToBadgeMap = {};
            existingCtfs.clear();
            let currentMonth = null, currentDay = null, currentCtf = null, currentBadgeRef = null;

            lines.forEach(line => {
                const s = line.trim();
                if (!s) return;

                // Month
                let m = s.match(/^###\s+(.+)/);
                if (m) {
                    currentMonth = m[1];
                    if (!parsedData[currentMonth]) parsedData[currentMonth] = {};
                    return;
                }

                // Day
                m = s.match(/^\*\s+\*\*(\d+)\*\*/);
                if (m) {
                    currentDay = parseInt(m[1], 10);
                    if (currentMonth && !parsedData[currentMonth][currentDay]) {
                        parsedData[currentMonth][currentDay] = {};
                    }
                    return;
                }

                // CTF Name & Badge
                m = s.match(/^\*\s+!\[(.*?)\]\[(.*?)\]/);
                if (m) {
                    currentCtf = m[1];
                    currentBadgeRef = m[2];
                    existingCtfs.add(currentCtf);
                    ctfToBadgeMap[currentCtf] = currentBadgeRef;

                    if (currentMonth && currentDay && !parsedData[currentMonth][currentDay][currentCtf]) {
                        parsedData[currentMonth][currentDay][currentCtf] = {
                            badgeRef: currentBadgeRef,
                            chals: []
                        };
                    }
                    return;
                }

                // Challenge
                m = s.match(/^\*\s+\[(.*?)\]\((.*?)\)\s+—\s+`(.*?)`/);
                if (m) {
                    if (currentMonth && currentDay && currentCtf) {
                        const catName = m[3];
                        categoriesSet.add(catName);
                        parsedData[currentMonth][currentDay][currentCtf].chals.push({
                            name: m[1], path: m[2], cat: catName
                        });
                    }
                    return;
                }

                // Footnote Badges
                m = line.match(/^\[(.*?)\]:\s+(.+)/);
                if (m) {
                    badges[m[1]] = m[2];
                }
            });

            // Update CTF select dropdown
            const ctfSelect = document.getElementById('formCtfSelect');
            ctfSelect.innerHTML = '';
            
            if (existingCtfs.size > 0) {
                const sortedCtfs = Array.from(existingCtfs).sort((a, b) => a.localeCompare(b, 'en', { sensitivity: 'base' }));
                sortedCtfs.forEach(ctf => {
                    const opt = document.createElement('option');
                    opt.value = ctf;
                    opt.textContent = ctf;
                    ctfSelect.appendChild(opt);
                });
            }
            
            const newOpt = document.createElement('option');
            newOpt.value = "NEW";
            newOpt.textContent = "＋ Create New CTF";
            ctfSelect.appendChild(newOpt);

            if (existingCtfs.size > 0) {
                ctfSelect.selectedIndex = 0;
            } else {
                ctfSelect.value = "NEW";
            }

            refreshAllCategorySelects();
            handleCtfChange();
            switchTab('tab-edit');
        }

        // Generate Markdown output
        function addWriteup() {
            if (Object.keys(parsedData).length === 0 && document.getElementById('inputMd').value.trim() !== "") {
                parseInput();
            }

            const month = document.getElementById('formMonth').value.trim();
            const day = parseInt(document.getElementById('formDay').value.trim(), 10);
            const selectVal = document.getElementById('formCtfSelect').value;
            const ctf = getSelectedCtfName();

            if (!month || !day || !ctf) {
                alert("Month, Day, and CTF Name are required.");
                return;
            }

            // Identify or create badge reference ID
            let badgeRef = '';
            if (selectVal === 'NEW') {
                badgeRef = document.getElementById('formBadgeRef').value.trim() || `badge-${ctf.toLowerCase().replace(/\s+/g, '')}`;
                const color = document.getElementById('formBadgeColor').value.replace('#', '');
                badges[badgeRef] = `https://img.shields.io/badge/${encodeURIComponent(ctf.replace(/\s+/g, '_'))}-${color}?style=flat-square`;
                ctfToBadgeMap[ctf] = badgeRef;
            } else {
                badgeRef = ctfToBadgeMap[ctf] || `badge-${ctf.toLowerCase().replace(/\s+/g, '')}`;
            }

            // Prepare base data
            if (!parsedData[month]) parsedData[month] = {};
            if (!parsedData[month][day]) parsedData[month][day] = {};

            // Reset challenges for this CTF entry (Overwrite with current form state)
            parsedData[month][day][ctf] = { badgeRef: badgeRef, chals: [] };

            // Collect problems
            const problemItems = document.querySelectorAll('.problem-item');
            lastAddedItems = [];
            lastAddedCtf = ctf;

            problemItems.forEach(item => {
                const chalName = item.querySelector('.input-chal').value.trim();
                const path = item.querySelector('.input-path').value.trim();
                const comment = item.querySelector('.input-comment').value.trim();
                
                const selectCat = item.querySelector('.input-cat-select').value;
                let cat = selectCat;
                if (selectCat === 'NEW') {
                    cat = item.querySelector('.input-cat-custom').value.trim() || 'Misc';
                    categoriesSet.add(cat);
                }

                if (chalName) {
                    parsedData[month][day][ctf].chals.push({ name: chalName, path: path, cat: cat, comment: comment });
                    lastAddedItems.push({ name: chalName, path: path, cat: cat, comment: comment });
                }
            });

            // Clean up empty nodes
            cleanEmptyNodes();

            refreshAllCategorySelects();
            renderOutput();
            renderXPost();
            switchTab('tab-output');
        }

        function cleanEmptyNodes() {
            Object.keys(parsedData).forEach(month => {
                Object.keys(parsedData[month]).forEach(day => {
                    Object.keys(parsedData[month][day]).forEach(ctf => {
                        if (!parsedData[month][day][ctf].chals || parsedData[month][day][ctf].chals.length === 0) {
                            delete parsedData[month][day][ctf];
                        }
                    });
                    if (Object.keys(parsedData[month][day]).length === 0) {
                        delete parsedData[month][day];
                    }
                });
                if (Object.keys(parsedData[month]).length === 0) {
                    delete parsedData[month];
                }
            });
        }

        // Direct item actions from Output Preview tab
        function editCtfGroup(month, day, ctfName) {
            document.getElementById('formMonth').value = month;
            document.getElementById('formDay').value = day;

            const ctfSelect = document.getElementById('formCtfSelect');
            if (Array.from(ctfSelect.options).some(o => o.value === ctfName)) {
                ctfSelect.value = ctfName;
            } else {
                ctfSelect.value = "NEW";
                document.getElementById('formCtfNew').value = ctfName;
            }

            handleCtfChange();
            switchTab('tab-edit');
        }

        function deleteCtfGroup(month, day, ctfName) {
            if (confirm(`Delete CTF group "${ctfName}" (${month} ${day})?`)) {
                if (parsedData[month] && parsedData[month][day] && parsedData[month][day][ctfName]) {
                    delete parsedData[month][day][ctfName];
                    cleanEmptyNodes();
                    renderOutput();
                    renderXPost();
                }
            }
        }

        function deleteChalItem(month, day, ctfName, chalIndex) {
            if (parsedData[month] && parsedData[month][day] && parsedData[month][day][ctfName]) {
                const chalList = parsedData[month][day][ctfName].chals;
                if (chalList && chalList[chalIndex]) {
                    const chalName = chalList[chalIndex].name;
                    if (confirm(`Delete challenge "${chalName}"?`)) {
                        chalList.splice(chalIndex, 1);
                        cleanEmptyNodes();
                        renderOutput();
                        renderXPost();
                    }
                }
            }
        }

        function renderOutput() {
            let out = [];
            let previewHtml = [];

            const sortedMonths = Object.keys(parsedData).sort((a, b) => {
                let idxA = MONTHS.indexOf(a);
                let idxB = MONTHS.indexOf(b);
                if (idxA === -1) idxA = 99;
                if (idxB === -1) idxB = 99;
                return idxA - idxB;
            });

            sortedMonths.forEach(month => {
                out.push(`### ${month}`);
                previewHtml.push(`<h3>${month}</h3>`);
                
                const sortedDays = Object.keys(parsedData[month]).sort((a, b) => b - a);
                
                previewHtml.push(`<ul>`);
                sortedDays.forEach(day => {
                    out.push(`* **${day}**`);
                    previewHtml.push(`<li><strong>${day}</strong><ul>`);
                    
                    const ctfs = parsedData[month][day];
                    const sortedCtfNames = Object.keys(ctfs).sort((a, b) => a.localeCompare(b, 'en', { sensitivity: 'base' }));

                    sortedCtfNames.forEach(ctfName => {
                        const ctfData = ctfs[ctfName];
                        out.push(`  * ![${ctfName}][${ctfData.badgeRef}]`);
                        const badgeUrl = badges[ctfData.badgeRef] || '';
                        
                        // CTF Header Row in Preview with Edit / Delete actions
                        const ctfEscaped = ctfName.replace(/'/g, "\\'");
                        const monthEscaped = month.replace(/'/g, "\\'");
                        previewHtml.push(`<li>
                            <div class="preview-item-row">
                                <div class="preview-item-content">
                                    <img src="${badgeUrl}" alt="${ctfName}">
                                </div>
                                <div class="preview-actions">
                                    <button class="btn-action-sm" onclick="editCtfGroup('${monthEscaped}', ${day}, '${ctfEscaped}')">✎ Edit</button>
                                    <button class="btn-action-sm btn-action-del" onclick="deleteCtfGroup('${monthEscaped}', ${day}, '${ctfEscaped}')">✕ Del</button>
                                </div>
                            </div>
                            <ul>`);

                        const sortedChals = [...ctfData.chals].sort((a, b) => a.name.localeCompare(b, 'en', { sensitivity: 'base' }));

                        sortedChals.forEach(chal => {
                            out.push(`    * [${chal.name}](${chal.path}) — \`${chal.cat}\``);

                            // Find original index in source array for accurate delete operation
                            const origIdx = ctfData.chals.findIndex(c => c.name === chal.name && c.path === chal.path);

                            previewHtml.push(`<li>
                                <div class="preview-item-row">
                                    <div class="preview-item-content">
                                        <a href="${chal.path}">${chal.name}</a> — <code>${chal.cat}</code>
                                    </div>
                                    <div class="preview-actions">
                                        <button class="btn-action-sm btn-action-del" onclick="deleteChalItem('${monthEscaped}', ${day}, '${ctfEscaped}', ${origIdx})">✕</button>
                                    </div>
                                </div>
                            </li>`);
                        });
                        previewHtml.push(`</ul></li>`);
                    });
                    previewHtml.push(`</ul></li>`);
                });
                previewHtml.push(`</ul>`);
            });

            out.push("\n\n");
            
            const sortedBadgeRefs = Object.keys(badges).sort((a, b) => a.localeCompare(b, 'en', { sensitivity: 'base' }));
            sortedBadgeRefs.forEach(ref => {
                out.push(`[${ref}]: ${badges[ref]}`);
            });

            document.getElementById('outputMd').value = out.join('\n') + '\n';
            document.getElementById('previewArea').innerHTML = previewHtml.join('');
        }

        // Render X (Twitter) post snippets (Separated per problem)
        function renderXPost() {
            const headerText = document.getElementById('xHeaderSelect').value;
            const container = document.getElementById('xPostsContainer');
            container.innerHTML = '';

            if (!lastAddedItems || lastAddedItems.length === 0) {
                container.innerHTML = '<p style="color:#aaa; font-size:0.85rem;">No recently generated items.</p>';
                return;
            }

            lastAddedItems.forEach((item, index) => {
                const catLower = item.cat.toLowerCase().replace(/[^a-z0-9_]/g, '');
                const cleanPath = item.path ? item.path.replace(/^\/+/, '') : '';
                const fullUrl = `${GITHUB_BASE_URL}/${cleanPath}`;
                
                let xText = `${headerText}\n\n`;
                if (lastAddedCtf) {
                    xText += `${lastAddedCtf}\n`;
                }
                xText += `・${item.name} - #${catLower}\n\n`;
                if (item.comment) {
                    xText += `${item.comment}\n\n`;
                }
                xText += `${fullUrl}\n\n#CTF #Writeup`;

                const cardId = `x-card-${index}`;
                const textId = `x-text-${index}`;

                const cardHTML = `
                    <div class="x-post-card" id="${cardId}">
                        <div class="x-post-card-header">Post #${index + 1}: ${item.name}</div>
                        <textarea id="${textId}" style="height: 110px; min-height: 90px; margin-bottom: 8px;">${xText}</textarea>
                        <div class="btn-row">
                            <button class="btn-main btn-x" onclick="copyOutput('${textId}', this, 'Copied!')">Copy Text</button>
                            <button class="btn-main btn-primary" onclick="postToX('${textId}')">Post to X</button>
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', cardHTML);
            });
        }

        function postToX(textId) {
            const text = document.getElementById(textId).value;
            const encodedText = encodeURIComponent(text);
            const twitterUrl = `https://twitter.com/intent/tweet?text=${encodedText}`;
            window.open(twitterUrl, '_blank');
        }

        async function copyOutput(targetId, btnEl, successMsg) {
            const outText = document.getElementById(targetId).value;
            const originalText = btnEl.innerText;
            const originalBg = btnEl.style.background;

            try {
                await navigator.clipboard.writeText(outText);
                btnEl.innerText = successMsg || 'Copied!';
                btnEl.style.background = '#4caf50';
            } catch (err) {
                const outArea = document.getElementById(targetId);
                outArea.select();
                document.execCommand('copy');
                btnEl.innerText = successMsg || 'Copied!';
                btnEl.style.background = '#4caf50';
            }

            setTimeout(() => {
                btnEl.innerText = originalText;
                btnEl.style.background = originalBg;
            }, 2000);
        }
    </script>
</body>
